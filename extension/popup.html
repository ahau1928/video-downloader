<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>视频下载器助手</title></head><body>
<header><span class="logo">↓</span><div><h1>视频下载器</h1><p>在熟悉的浏览器里，继续观看。</p></div></header>
<section><span class="eyebrow">当前页面</span><h2 id="site">正在读取…</h2><p id="title"></p></section>
<p class="explain">点击后授权读取当前网站的 Cookie，仅传给本机下载器。发送的视频先进入等待队列。</p>
<button id="send" disabled>授权并发送视频</button><button id="authorize" class="secondary" disabled>仅更新登录信息</button>
